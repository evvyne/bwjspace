<style>
/* Layout: fixed sidebar (spaces + page tree) beside a scrolling document column; drawer on phones */
:root{
  --bg:#F5F6F3; --side:#ECEEE9; --surface:#FFFFFF; --surface-2:#F0F2EE; --hover:rgba(29,33,37,.06);
  --line:#E1E4DD; --line-2:#CBD0C7; --ink:#1D2125; --ink-2:#4A5057; --ink-3:#7C8288;
  --accent:#1F7A6B; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA; --danger:#B4372B; --danger-soft:#F8E1DE;
  --c-teal:#1F7A6B; --c-coral:#C2552E; --c-violet:#5B4FC4; --c-blue:#2F6FB3; --c-rose:#B8457A; --c-slate:#6B7078; --c-amber:#A86E12; --c-green:#4A7F2A;
  --s-teal:#DCEFEA; --s-coral:#F6E1D8; --s-violet:#E7E4F8; --s-blue:#DEE9F5; --s-rose:#F7E0EB; --s-slate:#E6E8EA; --s-amber:#F7EAD2; --s-green:#E2EED9;
  --f-ui:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --shadow:0 10px 30px rgba(20,24,28,.12),0 2px 6px rgba(20,24,28,.06);
}
:root{--c-red:#B83A3A; --s-red:#F6DEDE; --c-orange:#C76A12; --s-orange:#F8E6D2; --c-mustard:#8C7A0E; --s-mustard:#F2EDCF; --c-olive:#6B7A1E; --s-olive:#ECEFD6; --c-sky:#1C7FA6; --s-sky:#DAEEF6; --c-navy:#2D3F8C; --s-navy:#DFE3F3; --c-purple:#8443B0; --s-purple:#EEE2F5; --c-plum:#8C3A6E; --s-plum:#F2E0EB; --c-pink:#D35C8E; --s-pink:#FBE3EE; --c-brown:#7A5235; --s-brown:#EEE4DC; --c-sand:#8F7A5A; --s-sand:#EFEAE1; --c-charcoal:#33363B; --s-charcoal:#E2E3E5;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-red:#E57373; --s-red:#3F2222; --c-orange:#E89A4F; --s-orange:#3F2C1A; --c-mustard:#D3BE4A; --s-mustard:#3A3519; --c-olive:#B3C25A; --s-olive:#2F3519; --c-sky:#5DBCE0; --s-sky:#1A3540; --c-navy:#8A9BE6; --s-navy:#232A48; --c-purple:#C08AE6; --s-purple:#35264A; --c-plum:#D68ABA; --s-plum:#3D2235; --c-pink:#F08DB5; --s-pink:#45253A; --c-brown:#C99A78; --s-brown:#3A2C22; --c-sand:#CDBB98; --s-sand:#37322A; --c-charcoal:#C4C8CE; --s-charcoal:#2E3236;}}
:root[data-theme="dark"]{--c-red:#E57373; --s-red:#3F2222; --c-orange:#E89A4F; --s-orange:#3F2C1A; --c-mustard:#D3BE4A; --s-mustard:#3A3519; --c-olive:#B3C25A; --s-olive:#2F3519; --c-sky:#5DBCE0; --s-sky:#1A3540; --c-navy:#8A9BE6; --s-navy:#232A48; --c-purple:#C08AE6; --s-purple:#35264A; --c-plum:#D68ABA; --s-plum:#3D2235; --c-pink:#F08DB5; --s-pink:#45253A; --c-brown:#C99A78; --s-brown:#3A2C22; --c-sand:#CDBB98; --s-sand:#37322A; --c-charcoal:#C4C8CE; --s-charcoal:#2E3236;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181B; --side:#1B1F22; --surface:#1F2327; --surface-2:#272C31; --hover:rgba(232,234,230,.07);
  --line:#2D3338; --line-2:#3B4248; --ink:#E7E9E5; --ink-2:#B4B9B3; --ink-3:#868C88;
  --accent:#5CC2AE; --accent-ink:#0D1A17; --accent-soft:#1D3A34; --danger:#F08A7E; --danger-soft:#3E2522;
  --c-teal:#4FB9A5; --c-coral:#E5845F; --c-violet:#A197EE; --c-blue:#6EA6E3; --c-rose:#E487B2; --c-slate:#9CA2A9; --c-amber:#E2AA4C; --c-green:#8CC266;
  --s-teal:#1D3A34; --s-coral:#40281F; --s-violet:#2D2A4A; --s-blue:#1F3045; --s-rose:#40243A; --s-slate:#2B3035; --s-amber:#3F321C; --s-green:#283A20;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15181B; --side:#1B1F22; --surface:#1F2327; --surface-2:#272C31; --hover:rgba(232,234,230,.07);
  --line:#2D3338; --line-2:#3B4248; --ink:#E7E9E5; --ink-2:#B4B9B3; --ink-3:#868C88;
  --accent:#5CC2AE; --accent-ink:#0D1A17; --accent-soft:#1D3A34; --danger:#F08A7E; --danger-soft:#3E2522;
  --c-teal:#4FB9A5; --c-coral:#E5845F; --c-violet:#A197EE; --c-blue:#6EA6E3; --c-rose:#E487B2; --c-slate:#9CA2A9; --c-amber:#E2AA4C; --c-green:#8CC266;
  --s-teal:#1D3A34; --s-coral:#40281F; --s-violet:#2D2A4A; --s-blue:#1F3045; --s-rose:#40243A; --s-slate:#2B3035; --s-amber:#3F321C; --s-green:#283A20;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3); color-scheme:dark }

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{display:inline-flex;flex:none}
.ic svg{display:block}

#app{display:flex;height:100%}
#sb{width:264px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sb-top{display:flex;align-items:center;gap:10px;padding:14px max(12px,env(safe-area-inset-left,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.logo{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 15px/1 var(--f-display)}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;flex:1}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 10px 12px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sb-search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink-3);font-size:14px;width:100%;text-align:left}
.sb-search kbd{margin-left:auto;font:12px var(--f-ui);color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:1px}
.ni{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:7px;color:var(--ink-2);font-size:14.5px;width:100%;text-align:left}
.ni:hover,.ti:hover{background:var(--hover)}
.ni.on{background:var(--surface);color:var(--ink);font-weight:600}
.sec-l{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 10px 4px}
.sp-h{display:flex;align-items:center;border-radius:7px}
.sp-h:hover{background:var(--hover)}
.sp-h.dragging{opacity:.4}
.sp-h.drop-above{box-shadow:0 -2px 0 var(--accent)}
.sp-h.drop-below{box-shadow:0 2px 0 var(--accent)}
.sp-t{flex:1;display:flex;align-items:center;gap:9px;min-height:34px;padding:0 10px;font-weight:600;font-size:14px;color:var(--ink);text-align:left}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.ti{display:flex;align-items:center;border-radius:7px;min-height:32px;color:var(--ink-2)}
.ti.on{background:var(--surface);color:var(--ink)}
.tw{width:22px;height:26px;display:grid;place-items:center;color:var(--ink-3);border-radius:5px;flex:none}
.tw.none{visibility:hidden}
.tl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:32px;text-align:left;font-size:14px}
.tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emo{font-size:15px;line-height:1;width:16px;text-align:center}
.ta{width:26px;height:26px;display:grid;place-items:center;border-radius:5px;color:var(--ink-3);opacity:0;flex:none;margin-right:2px}
.ti:hover .ta,.sp-h:hover .ta,.ta:focus-visible{opacity:1}
.ta:hover,.tw:hover{background:var(--hover);color:var(--ink)}
.sb-foot{border-top:1px solid var(--line);padding:8px 10px max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;gap:4px}
.sb-foot .ni{flex:1}
.sb-ver{font-size:11px;color:var(--ink-3);padding:0 14px max(8px,env(safe-area-inset-bottom,0px));margin-top:-4px}
.empty-tree{font-size:13px;color:var(--ink-3);padding:2px 10px 4px 32px}

#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{display:none;align-items:center;gap:8px;height:52px;border-bottom:1px solid var(--line);background:var(--bg);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.topbar .tb-t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{flex:1;overflow-y:auto;overflow-x:hidden}
#scrim{display:none}

.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-2)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.ghost{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:7px;color:var(--ink-3);font-size:13.5px}
.ghost:hover{background:var(--hover);color:var(--ink-2)}
.field{height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);width:100%;min-width:0}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{height:auto;padding:10px 12px;resize:vertical}

/* document */
.cover{height:150px}
.doc{max-width:780px;margin:0 auto;padding-block:36px 160px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.doc.wide{max-width:1120px}
.cover+.doc{padding-top:14px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--ink-3);min-height:24px}
.crumbs button{color:var(--ink-3);padding:2px 4px;border-radius:5px}
.crumbs button:hover{background:var(--hover);color:var(--ink-2)}
.page-icon{font-size:52px;line-height:1;margin-top:14px;padding:4px;border-radius:10px}
.page-icon:hover{background:var(--hover)}
.page-acts{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0 2px;opacity:.85}
.ttl-row{display:flex;align-items:flex-start;gap:8px}
.ptitle{flex:1;min-width:0;font:600 40px/1.15 var(--f-display);letter-spacing:-.015em;margin:6px 0 10px;outline:none;text-wrap:balance;word-break:break-word}
.ptitle:empty::before{content:attr(data-ph);color:var(--ink-3)}
.ttl-tools{display:flex;gap:2px;margin-top:14px}
.star.on{color:var(--c-amber)}

.blocks{display:flex;flex-direction:column}
.blk{--gw:56px;position:relative;display:flex;align-items:flex-start;margin-left:calc(var(--ind,0) * 26px - var(--gw));border-radius:6px;touch-action:pan-y pinch-zoom}
.cmb{position:absolute;right:-48px;top:1px;width:40px;display:flex;justify-content:center;z-index:1}
.cm-add{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;opacity:0;transition:opacity .12s}
.blk:hover .cm-add,.cm-add:focus-visible{opacity:1}
.cm-add:hover{color:var(--accent);border-color:var(--accent)}
.cm-badge{height:26px;padding:0 8px;border-radius:999px;background:var(--s-amber);color:var(--c-amber);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.blk.cm-focus .cm-badge{background:var(--c-amber);color:var(--bg)}
.blk.has-cm>.bbody .txt{background:color-mix(in srgb,var(--c-amber) 14%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c-amber) 60%,transparent);border-radius:2px}
.blk.cm-focus>.bbody .txt{background:color-mix(in srgb,var(--c-amber) 26%,transparent);box-shadow:inset 0 -2px 0 var(--c-amber)}
.shared-mode .share-bar.comment{background:var(--s-violet);color:var(--c-violet)}
.shared-ro .blk{cursor:default}
.cm-tool.on{color:var(--c-amber);border-color:var(--c-amber)}
.cm-count{margin-left:auto;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--c-amber);color:var(--bg);font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.cm-panel{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100%;background:var(--side);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.cm-head{display:flex;align-items:center;gap:6px;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
.cm-head h2{margin:0;flex:1;font-size:16px;font-family:var(--f-ui);font-weight:700}
.cm-link{font-size:13px;color:var(--ink-2);padding:6px}
.cm-link:hover{color:var(--ink)}
.cm-list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.cm-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cm-card.focus{border-color:var(--c-amber)}
.cm-card.done{opacity:.6}
.cm-on{text-align:left;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-on:hover{color:var(--ink-2)}
.cm-item{display:flex;gap:9px}
.cm-av{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#15181B}
.cm-body{min-width:0;flex:1}
.cm-meta{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:2px}
.cm-meta b{color:var(--ink);font-weight:600}
.cm-del{margin-left:auto;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);opacity:0}
.cm-item:hover .cm-del,.cm-del:focus-visible{opacity:1}
.cm-del:hover{color:var(--danger)}
.cm-text{font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.cm-compose{display:flex;flex-direction:column;gap:8px}
.cm-ta{resize:vertical;min-height:58px;font-size:14px}
.cm-acts{display:flex;align-items:center;gap:6px}
.cm-resolved{font-size:12.5px;color:var(--accent)}
.cm-pagebtn{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13.5px;padding:8px 4px}
.cm-pagebtn:hover{color:var(--ink)}
.doc.welcome{max-width:400px;text-align:center;padding-top:16vh}
@media (min-width:1101px){ body.cm-on #main{margin-right:360px} }
@media (max-width:1100px){ .cmb{right:-6px;top:-10px;width:auto} .cm-add{display:none} }
body.cm-on .cmb{right:-6px;top:-10px;width:auto}
@media (max-width:760px){ .cm-panel{top:auto;left:0;width:auto;max-height:78vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0} }
@media (hover:none){ .cm-add{display:none} .cm-del{opacity:.7} }
.cb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.cb-plats{display:flex;flex-wrap:wrap;gap:6px}
.cb-plats .pm-chip{height:30px;padding:0 12px;font-size:13px}
.cb-board .bcol h3{display:flex;align-items:center;gap:8px}
.cb-dot{width:9px;height:9px;border-radius:50%;flex:none}
.cb-name{font-weight:700;font-size:14px;color:var(--ink)}
.cb-card{display:flex;flex-direction:column;gap:8px}
.cb-date{font-size:12px;color:var(--ink-2)}
.cb-mvs{display:flex;justify-content:space-between;gap:6px}
.cb-mv{height:26px;padding:0 9px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:500}
.cb-mv:hover{color:var(--ink);background:var(--hover)}
#bnav{display:none}
@media (max-width:860px){
  #bnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));flex:none;border-top:1px solid var(--line);background:var(--side);padding:4px max(6px,env(safe-area-inset-left,0px)) max(6px,env(safe-area-inset-bottom,0px))}
  #bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:var(--ink-3);font-size:11.5px;font-weight:600}
  #bnav button.on{color:var(--accent)}
  .sb-foot{padding-bottom:10px}
}
.shared-mode #bnav{display:none!important}
.cm-list p{white-space:normal}
.hist-v{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:10px;border:1px solid transparent;text-align:left;width:100%}
.hist-v:hover{background:var(--hover)}
.hist-v.on{background:var(--surface);border-color:var(--accent)}
.hist-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.hist-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.hist-tx b{font-size:14px;font-weight:600}
.hist-tx span{font-size:12.5px;color:var(--ink-2)}
.hist-tx small{font-size:12px;color:var(--ink-3)}
.hist-foot{display:flex;flex-direction:column;gap:8px;padding:12px 14px max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.hist-foot .btn{justify-content:center;height:42px}
.hp-chip{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:8px;background:var(--s-amber);color:var(--c-amber);font-size:13px;font-weight:600;margin:4px 0 10px}
.hist-prev{display:flex;flex-direction:column;gap:2px}
.hp-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.hp-legend span{display:flex;align-items:center;gap:6px}
.hp-sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.hp-sw.back,.hp-back{background:color-mix(in srgb,var(--c-green) 22%,transparent)}
.hp-sw.chg,.hp-chg{background:color-mix(in srgb,var(--c-amber) 20%,transparent)}
.hp-sw.gone,.hp-gone{background:color-mix(in srgb,var(--c-red) 20%,transparent)}
.hp-gone{text-decoration:line-through;color:var(--ink-2)}
.hp-l{padding:3px 8px;border-radius:6px;font-size:15.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}

.pg-srow{display:flex;gap:8px;align-items:center}
.pg-sbox{position:relative;flex:1;min-width:0}

.pg-none{border:1.5px dashed var(--line-2);border-radius:14px;padding:36px;text-align:center;color:var(--ink-2);margin-bottom:16px}
.pcard[hidden]{display:none}
.pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pband{height:60px;display:flex;align-items:flex-end;padding:0 16px 9px;font-size:12.5px;font-weight:600}
.pbody{position:relative;padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pfab{position:absolute;top:-21px;right:14px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);box-shadow:var(--shadow)}
.pfab:hover{border-color:var(--accent);color:var(--accent)}
.pfab.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pctitle{text-align:left;font-weight:600;font-size:16px;padding-right:40px}
.pctitle:hover{text-decoration:underline}
.ptext{margin:0;color:var(--ink-2);font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.ptext.empty{color:var(--ink-3);font-style:italic}

textarea.cell.area{resize:none;padding:8px 10px;line-height:1.5;min-height:36px;height:auto;font:inherit;overflow:hidden}

/* prompt pop-up */
.modal.pm{max-width:680px}

.pm-cnt{font-size:12px;color:var(--ink-3);text-align:right}
.pm-chips{display:flex;flex-wrap:wrap;gap:6px}
.pm-chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font-size:13.5px;white-space:nowrap;color:var(--ink-2)}
.pm-chip:hover{border-color:var(--ink-3);color:var(--ink)}
.pm-chip.on{font-weight:600;border-width:1.5px}
.pm-chip.add{border-style:dashed;color:var(--ink-3)}
.pm-newcat{height:34px;width:160px;border-radius:999px}
.pm-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.pm-sug{display:flex;flex-wrap:wrap;gap:6px}
.pm-sug button{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.pm-sug button:hover{border-color:var(--ink-3);color:var(--ink)}
.pm-pvw{border-top:1px solid var(--line);padding-top:14px}
.pm-pvw .pm-l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.pm-pv{max-width:320px;pointer-events:none}
.pm-pv .pctitle{display:block}
.pm-err{margin:0;color:var(--danger);font-size:13.5px}
.pm-ft{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:4px}
.pm-ft small{flex:1;color:var(--ink-3);font-size:12.5px;min-width:120px}

/* simple table */
.tbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;margin:4px 0}
.tbl-row{display:flex;align-items:stretch;gap:4px;max-width:100%}
.tsc{overflow-x:auto;border:1px solid var(--line-2);border-radius:9px;max-width:100%;min-width:0;background:var(--surface)}
table.st{border-collapse:collapse;font-size:14.5px}
table.st.fixed{table-layout:fixed}
table.st.fixed td{min-width:0;max-width:none}
table.st.rz-hover,table.st.rz-hover td,table.st.rz-on,table.st.rz-on td{cursor:col-resize}
table.st.rz-on{user-select:none}
.ti.drop-above{box-shadow:0 -2px 0 var(--accent)}
.ti.drop-below{box-shadow:0 2px 0 var(--accent)}
.ti.drop-into,.sp-h.drop-into{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.ti.dragging{opacity:.45}

.st td{border:1px solid var(--line);padding:7px 10px;min-width:120px;max-width:340px;outline:none;vertical-align:top;line-height:1.5;word-break:break-word}
.st tr:first-child td{border-top:0}.st td:first-child{border-left:0}.st td:last-child{border-right:0}.st tr:last-child td{border-bottom:0}
.st.head tr:first-child td{background:var(--surface-2);font-weight:600}
.st td:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.tbl-addc{width:22px;flex:none;border-radius:7px;border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--ink-3);opacity:0;transition:opacity .12s}
.tbl-addr{display:flex;align-items:center;justify-content:center;gap:5px;height:26px;border-radius:7px;border:1px dashed var(--line-2);color:var(--ink-3);font-size:12.5px;opacity:0;transition:opacity .12s;max-width:100%}
.tbl:hover .tbl-addc,.tbl:hover .tbl-addr,.tbl:focus-within .tbl-addc,.tbl:focus-within .tbl-addr,.tbl-addc:focus-visible,.tbl-addr:focus-visible{opacity:1}
.tbl-addc:hover,.tbl-addr:hover{color:var(--ink);border-color:var(--ink-3)}
@media (hover:none){.tbl-addc,.tbl-addr{opacity:.8}}

/* sync */
.sb-sync{padding:4px 10px 0 max(10px,env(safe-area-inset-left,0px))}
.sync-pill{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--ink-3);text-align:left}
.sync-pill:hover{background:var(--hover);color:var(--ink-2)}
.sync-pill.s-ok .ic{color:var(--accent)}
.sync-pill.s-syncing .ic{color:var(--accent);animation:spin 1s linear infinite}
.sync-pill.s-error{color:var(--danger)}
.sync-pill.s-nokey,.sync-pill.s-offline,.sync-pill.s-badkey{color:var(--c-amber)}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-box{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.sync-box .ic{color:var(--accent)}
.sync-box b{display:block;font-weight:600}
.sync-box small{color:var(--ink-3);font-size:13px}
.bk-list{display:flex;flex-direction:column}
.bk-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.bk-row span{flex:1}
.bk-row:last-child{border-bottom:0}

/* sync key */
.choice{display:flex;flex-direction:column;gap:8px}
.choice-b{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line-2);border-radius:12px;padding:14px}
.choice-b:hover{border-color:var(--ink-3);background:var(--surface-2)}
.choice-b .ic{color:var(--accent);margin-top:2px}
.choice-b b{display:block;font-weight:600}
.choice-b small{display:block;color:var(--ink-3);font-size:13px}
.keycard{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--surface-2);border-radius:12px;padding:14px}
.qr{width:168px;max-width:100%;flex:none;border-radius:8px;overflow:hidden;background:#fff}
.qr svg{display:block;width:100%;height:auto}
.keytx{flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px}
.skey{font:600 15px/1.5 var(--f-mono);word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:all}
.scan{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.scan video{width:100%;max-height:280px;border-radius:10px;background:#000;object-fit:cover}

/* sharing */
.share-b{gap:6px}
.share-b.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.shared-dot{display:inline-flex;color:var(--accent);margin-left:4px;flex:none}
.shp{border:1px solid var(--line);border-radius:10px;padding:6px}
.shp-head{display:flex;align-items:center;gap:8px;padding:4px 8px 6px;font-size:13.5px}
.shp-head b{flex:1;font-weight:600}
.shp-list{max-height:260px;overflow-y:auto}
.shp-row{display:flex;align-items:center;gap:9px;min-height:38px;padding-right:8px;border-radius:8px;cursor:pointer;font-size:14px}
.shp-row:hover{background:var(--hover)}
.shp-row.fixed{cursor:default}
.shp-row input{width:17px;height:17px;accent-color:var(--accent);flex:none}
.shp-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shp-ic{width:18px;text-align:center}
.tgl.sm{transform:scale(.85);transform-origin:left center;flex:none}
.sh-wrap{display:flex;align-items:flex-start;min-height:100%}
.sh-main{flex:1;min-width:0}
.sh-nav{width:230px;flex:none;position:sticky;top:0;align-self:stretch;min-height:100%;background:var(--side);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;box-sizing:border-box}
.sh-nav-h{display:flex;align-items:center;gap:9px;padding:4px 8px 10px;font-weight:700;font-size:14.5px}
.sh-nav-i{display:flex;align-items:center;gap:8px;min-height:34px;border-radius:7px;padding-right:8px;color:var(--ink-2);font-size:14px;text-align:left}
.sh-nav-i:hover{background:var(--hover)}
.sh-nav-i.on{background:var(--surface);color:var(--ink)}
.sh-nav-i .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){ .sh-wrap{flex-direction:column} .sh-nav{width:auto;min-height:0;position:static;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:4px} .sh-nav-h{display:none} .sh-nav-i{padding-left:10px!important;white-space:nowrap;flex:none} }
.share-box{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tgl{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;flex:none;cursor:pointer}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on{background:var(--accent)}.tgl.on::after{left:21px}
.shared-mode #sb,.shared-mode #scrim,.shared-mode #tb-menu,.shared-mode #tb-search,.shared-mode .ttl-tools>:not(.cm-tool){display:none!important}
.shared-mode .ttl-tools .cm-tool[hidden]{display:none!important}
.share-bar{display:flex;align-items:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));font-size:13.5px;border-bottom:1px solid var(--line)}
.share-bar.view{background:var(--s-blue);color:var(--c-blue)}

.share-bar .sb-st{font-size:12.5px;opacity:.85;white-space:nowrap}
.shared-ro .g,.shared-ro .page-acts,.shared-ro .tbl-addc,.shared-ro .tbl-addr,.shared-ro .dtools,.shared-ro .dres,.shared-ro .ihandle,.shared-ro .lcard .icon-btn,.shared-ro .place .btn,.shared-ro .page-icon{pointer-events:none}
.shared-mode .pnew,.shared-mode .addrow,.shared-mode .cc .add{display:none}
.shared-ro .g{visibility:hidden}
.shared-ro .pg-edit,.shared-ro .pnew{display:none}
.blk.conflict{background:color-mix(in srgb,var(--c-amber) 13%,transparent);box-shadow:inset 3px 0 0 var(--c-amber);border-radius:6px;padding-bottom:6px;margin-top:3px;margin-bottom:3px;flex-wrap:wrap}
.cbar{display:flex;align-items:center;gap:10px;flex-basis:100%;padding:2px 0 0 calc(var(--gw,0px) + 10px);font-size:12.5px;color:var(--ink-2)}
.cbar .btn.sm{height:26px;padding:0 10px;font-size:12.5px;gap:4px}
.shared-ro .cbar .btn{display:none}

.shared-ro .page-acts,.shared-ro .tbl-addc,.shared-ro .tbl-addr,.shared-ro .dtools,.shared-ro .dres,.shared-ro .ihandle,.shared-ro .lcard .icon-btn{display:none}
.shared-ro .dcan{pointer-events:none;cursor:default}

/* review */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font:600 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-3)}
.stat.warn b{color:var(--c-amber)}
.stat .bar{display:block;height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.revgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.revgrid .card .tlist{margin:0 -6px}
.rep{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.rep:last-child{border-bottom:0}
.rep .tx{flex:1;min-width:0}
.rep b{display:block;font-weight:600;font-size:14px}
.rep small{color:var(--ink-3);font-size:12.5px}
.repn{font-weight:700;font-variant-numeric:tabular-nums;color:var(--c-amber)}
.repn.full{color:var(--accent)}
.donelist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.dl{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);padding:3px 0}
.dl .ic{color:var(--accent)}
.dl .dlt{flex:1;min-width:0}
.dl small{color:var(--ink-3);font-size:12px;white-space:nowrap}

/* month calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:1100px){.calwrap{grid-template-columns:minmax(0,1fr) 330px}}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.mcal .wd{font-size:12px;color:var(--ink-3);padding:7px 8px;border-bottom:1px solid var(--line);font-weight:600}
.mc{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;transition:background .12s}
.mc:nth-child(7n){border-right:0}
.mc:hover{background:var(--hover)}
.mc.sel{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--ink-3)}
.mc.dz-over{background:var(--accent-soft)}
.mc.out .mn{opacity:.4}
.mn{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.mc.today .mn{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cchip{font-size:11.5px;line-height:1.4;padding:1px 6px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface-2);color:var(--ink);flex:none}
.cchip.done{color:var(--ink-3);text-decoration:line-through}
.cmore{font-size:11px;color:var(--ink-3);padding-left:4px}
.calt{font-size:34px}
@media (max-width:600px){.calt{font-size:26px}}
.calpanel{display:flex;flex-direction:column;scroll-margin-top:12px}
.calpanel .day{min-height:200px}
@media (max-width:600px){.mc{min-height:62px;padding:2px 2px 4px}.cchip{font-size:0;height:5px;padding:0;border-radius:3px;background:var(--ink-3)}.cchip.done{background:var(--line-2)}.cmore{font-size:10px;padding:0}.mn{width:24px;height:24px;font-size:12px}}
.cap{outline:none;font-size:13.5px;color:var(--ink-3);padding:0 2px}
.cap:empty::before{content:attr(data-ph);color:var(--ink-3);opacity:.7}
.place{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface-2);border-radius:var(--r);padding:14px;color:var(--ink-3);font-size:14px}
.place .field{flex:1;min-width:180px;height:36px}
.lcard{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.lbadge{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:700;font-size:12px}
.lmeta{flex:1;min-width:0}
.lmeta b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta span{display:block;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plink{flex:1;display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-weight:500;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;text-align:left}
.plink:hover{background:var(--hover)}
.pick-list{display:flex;flex-direction:column;max-height:220px;overflow:auto;width:100%}
.pick-list button{text-align:left;padding:7px 8px;border-radius:6px;display:flex;gap:8px;align-items:center}
.pick-list button:hover{background:var(--hover)}

/* drawing */
.draw{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.dtools{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 8px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.dt{width:34px;height:34px;display:grid;place-items:center;border-radius:7px;color:var(--ink-2);border:1px solid transparent}
.dt:hover{background:var(--hover)}
.dt.on{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.szb{width:30px;height:34px;display:grid;place-items:center;border-radius:7px}
.szb i{display:block;border-radius:50%;background:var(--ink-2)}
.szb.on{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2)}
.dsep{width:1px;height:22px;background:var(--line-2);margin:0 4px}
.dcan{display:block;width:100%;touch-action:none;cursor:crosshair;background:var(--surface)}
.dres{height:14px;display:grid;place-items:center;cursor:ns-resize;touch-action:none;border-top:1px solid var(--line);background:var(--surface-2)}
.dres i{width:36px;height:4px;border-radius:2px;background:var(--line-2)}
.dt.dclr{width:auto;padding:0 9px;font-size:12.5px}
.dt.drm{margin-left:auto;width:auto;padding:0 10px;gap:5px;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center}
.dt.drm:hover{color:var(--danger)}
.bbody{position:relative}
.bdel{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);box-shadow:var(--shadow);opacity:0;transition:opacity .12s;z-index:2}
.blk:hover .bdel,.blk:focus-within .bdel{opacity:1}
.bdel:hover{color:var(--danger);border-color:var(--danger)}
.t-divider .bdel{top:50%;transform:translateY(-50%);width:28px;height:28px}
@media (hover:none){.bdel{opacity:.85}}
.shared-ro .bdel,.shared-ro .drm{display:none}
.dlabel{margin-left:auto;font-size:12px;color:var(--ink-3);padding-right:4px}

/* popovers, modal, toast */
.pop{position:fixed;z-index:80;min-width:220px;max-width:min(320px,calc(100vw - 16px));max-height:min(420px,70vh);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px}

/* ---------- cloud sync (Supabase) ----------
   Rules that keep data safe:
   1. Every page, to-do, repeat rule, the space list and your name are separate records. Nothing is ever
      uploaded or downloaded as one big file, so one device can never replace everything at once.
   2. Only changes YOU make get a new "changed at" time and get uploaded. Automatic housekeeping
      (format updates, moving unfinished to-dos to today, creating repeat copies) runs on each device
      by itself, keeps the old time and is never uploaded. Old data can not pretend to be new.
   3. Each record remembers which cloud version it was based on ("base"). The server only accepts an
      upload if nobody changed that record in the cloud since then. An old phone or an old browser tab
      is refused instead of overwriting newer work.
   4. When the same note page was changed on two devices, both versions are kept (conflict copy).
      For to-dos and other small items the one changed most recently wins.
   5. Deletions are remembered, so a deleted item does not come back from another device. */

/* Compare current data with what we last recorded.

    if(!m){ n++;

      else if(isAuto) M[id]={h:hsh,h0:hsh,u:1,b:0,d:0};
      else { M[id]={h:hsh,h0:hsh,u:now,b:0,d:1}; user++; } }
    else if(m.h!==hsh||m.x){ n++;
      if(isAuto&&!m.x){ m.h=hsh; }
      else { m.h=hsh; m.u=Math.max(now,(m.u||0)+1); m.d=1; m.x=0; user++; } } });
  Object.keys(M).forEach(id=>{ if(!recs.has(id)&&!M[id].x){ n++;

    else { M[id]={h:null,u:Math.max(now,(M[id].u||0)+1),b:M[id].b||0,d:1,x:1}; user++; } } });

/* automatic local backups: one per day, the last 7 days, kept on this device */
async function dailyBackup(){ try{ const d=await idb(); const key='bk:'+todayStr();

    if(SHARED.base[pid]===it.updated) return;

    } else { if(S.pages[pid]) replaceIn(S.pages[pid],it.data); else S.pages[pid]=it.data; SHARED.hash[pid]=JSON.stringify(S.pages[pid]); }
    SHARED.base[pid]=it.updated; SHARED.baseData[pid]=cl(it.data); changed=true; if(onPage(pid)) cur=true; });

function rows(db){ return pages().filter(p=>p.dbId===db.id&&!p.trashed).sort((a,b)=>(a.order??a.created)-(b.order??b.created)); }
const space=id=>S.spaces.find(s=>s.id===id)||null;

const kindIcon=p=>p.kind==='db'?'table':p.kind==='journal'?'book':'page';

function weekStart(s){ const d=parseYmd(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }

/* repeating */
const WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  if(r.freq==='monthly') return 'Every month on the '+ord(r.dom||1);
  const d=(r.days||[]).slice().sort();
